<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'registration/style.css' %}">
</head>
<body>
    <h1>{{ page_title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Student</button>
    </form>

    <p style="margin-top: 20px;">
        <a href="{% url 'student_list' %}">Cancel / Back to Directory</a>
    </p>
</body>
</html>
